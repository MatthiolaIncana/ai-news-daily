name: Daily AI News

on:
  # 纯 GitHub 方案：使用单个周期 cron，写法与已稳定运行的 Tibo 监控一致。
  # 北京时间 09:17/09:47/10:17/10:47/11:17/11:47 尝试；
  # 当天首次成功后，后续运行由 --skip-if-sent-today 自动跳过。
  schedule:
    - cron: "17,47 9-11 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-news
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build and send daily report
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          echo "event=${{ github.event_name }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python src/main.py --skip-if-sent-today
          else
            python src/main.py
          fi

      - name: Persist delivery state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/state/history.json ] && git add data/state/history.json
          [ -f data/state/last_delivery.json ] && git add data/state/last_delivery.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update news delivery state [skip ci]"
            git push
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-debug-${{ github.run_number }}
          path: data/last_debug.json
          if-no-files-found: ignore
          retention-days: 14
