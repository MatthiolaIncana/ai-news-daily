name: Daily AI News

on:
  # 纯 GitHub 方案：避开整点高峰，并提供 4 次独立重试。
  # 采用北京时间本地时区声明，避免手算 UTC。
  schedule:
    - cron: "17 9 * * *"
      timezone: "Asia/Shanghai"
    - cron: "27 9 * * *"
      timezone: "Asia/Shanghai"
    - cron: "37 9 * * *"
      timezone: "Asia/Shanghai"
    - cron: "47 9 * * *"
      timezone: "Asia/Shanghai"
  workflow_dispatch:
    inputs:
      retry_mode:
        description: "External watchdog retry; skip if Beijing date already delivered"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      trigger_source:
        description: "Optional trigger source for diagnostics"
        required: false
        default: "manual"
        type: string
      scheduled_time:
        description: "Optional external scheduler timestamp"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: daily-ai-news
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build and send daily report
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          echo "event=${{ github.event_name }} retry_mode=${{ inputs.retry_mode }} source=${{ inputs.trigger_source }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.retry_mode }}" = "true" ]; then
            python src/main.py --skip-if-sent-today
          else
            python src/main.py
          fi

      - name: Persist delivery state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/state/history.json ] && git add data/state/history.json
          [ -f data/state/last_delivery.json ] && git add data/state/last_delivery.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update news delivery state [skip ci]"
            git push
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-debug-${{ github.run_number }}
          path: data/last_debug.json
          if-no-files-found: ignore
          retention-days: 14
