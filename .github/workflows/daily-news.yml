# Restored after Actions history cleanup
name: Daily AI News

on:
  schedule:
    - cron: "0 1 * * *"
    - cron: "5 1 * * *"
    - cron: "10 1 * * *"
    - cron: "15 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-news
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build and send daily report
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python src/main.py --skip-if-sent-today
          else
            python src/main.py
          fi

      - name: Persist delivery history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/state/history.json ] && git add data/state/history.json
          [ -f data/state/last_delivery.json ] && git add data/state/last_delivery.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update news delivery state [skip ci]"
            git push
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-debug-${{ github.run_number }}
          path: data/last_debug.json
          if-no-files-found: ignore
          retention-days: 14
