name: Daily AI News

on:
  # GitHub 自带 schedule 继续保留为兜底。
  # Cloudflare 独立触发器会在这些时间后的第 2 分钟再次检查并触发，
  # 避免 GitHub schedule 整体延迟/丢失成为单点故障。
  schedule:
    - cron: "0 1 * * *"
    - cron: "5 1 * * *"
    - cron: "10 1 * * *"
    - cron: "15 1 * * *"
  workflow_dispatch:
    inputs:
      retry_mode:
        description: "External watchdog retry; skip if Beijing date already delivered"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      trigger_source:
        description: "Optional trigger source for diagnostics"
        required: false
        default: "manual"
        type: string
      scheduled_time:
        description: "Optional external scheduler timestamp"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: daily-ai-news
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build and send daily report
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          echo "event=${{ github.event_name }} retry_mode=${{ inputs.retry_mode }} source=${{ inputs.trigger_source }}"
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.retry_mode }}" = "true" ]; then
            python src/main.py --skip-if-sent-today
          else
            python src/main.py
          fi

      - name: Persist delivery state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/state/history.json ] && git add data/state/history.json
          [ -f data/state/last_delivery.json ] && git add data/state/last_delivery.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update news delivery state [skip ci]"
            git push
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-debug-${{ github.run_number }}
          path: data/last_debug.json
          if-no-files-found: ignore
          retention-days: 14
