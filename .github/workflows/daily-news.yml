# Restored after Actions history cleanup
name: Daily AI News

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-ai-news
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build and send daily report
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: python src/main.py

      - name: Persist delivery history
        if: success()
        run: |
          if [ -f data/state/history.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/state/history.json
            if ! git diff --cached --quiet; then
              git commit -m "chore: update news delivery history [skip ci]"
              git push
            fi
          fi

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-news-debug-${{ github.run_number }}
          path: data/last_debug.json
          if-no-files-found: ignore
          retention-days: 14
