[settings]
min_score = 13
lookback_hours = 30
timezone = "Asia/Shanghai"
title = "AI 工具链情报日报"
require_change_signal = true
negative_keywords = [
  "融资", "funding round", "fundraiser", "raises $", "stock price", "shares jump",
  "celebrity", "明星", "sponsored", "advertorial", "coupon", "discount code",
  "招聘", "job opening", "财报", "earnings call"
]
editorial_phrases = [
  "best ai tools", "top ai tools", "top 10", "everything you need to know",
  "what is ", "explained", "how to use", "tutorial", "beginner guide",
  "opinion", "interview", "prediction", "rumor", "rumour",
  "could change everything", "game changer", "revolutionary",
  "必看", "盘点", "教程", "如何使用", "怎么用", "是什么", "观点",
  "访谈", "预测", "传闻", "震惊", "改变一切", "革命性"
]
low_value_phrases = [
  "review", "hands-on", "first look", "comparison", " vs ", "best ",
  "评测", "测评", "上手", "对比", "推荐"
]
change_signals = [
  "release", "released", "launch", "launched", "introduces", "introduced",
  "announce", "announced", "update", "updated", "upgrade", "new model",
  "new version", "api", "pricing", "price change", "deprecated", "deprecation",
  "now supports", "adds support", "added support", "rollout", "rolling out",
  "benchmark", "accuracy", "quality improvement", "fix", "fixed", "changelog",
  "发布", "上线", "推出", "更新", "升级", "新增", "开放", "接口", "API",
  "价格", "降价", "涨价", "弃用", "下线", "版本", "修复", "提升",
  "准确率", "质量提升", "支持"
]

[source_quality]
preferred_publishers = [
  "OpenAI", "Anthropic", "Google", "Google DeepMind", "Microsoft", "GitHub",
  "ByteDance", "CapCut", "Runway", "Midjourney", "Hugging Face",
  "Reuters", "TechCrunch", "The Verge", "Ars Technica"
]

